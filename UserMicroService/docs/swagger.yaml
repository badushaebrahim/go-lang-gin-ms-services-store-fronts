basePath: /
definitions:
  models.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  models.UserCreationRequest:
    properties:
      email:
        type: string
      gender:
        type: string
      password:
        type: string
      userName:
        type: string
    type: object
  models.UserCreationResposnce:
    properties:
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      password:
        type: string
      status:
        type: string
      userName:
        type: string
    type: object
  models.UserListResponse:
    properties:
      email:
        type: string
      gender:
        type: string
      id:
        type: integer
      status:
        type: string
      userName:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample service for managing products.
  title: Product API
  version: "1.0"
paths:
  /users:
    get:
      description: Retrieves all users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserListResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Get all users
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserCreationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User creation response
          schema:
            $ref: '#/definitions/models.UserCreationResposnce'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create a user
swagger: "2.0"
