# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Install swag
      # Install swag globally so it's available in the PATH
      run: go install github.com/swaggo/swag/cmd/swag@latest

    - name: Generate Swagger docs in directories with main.go
      run: |
        # Find all directories containing a main.go file
        # Use find ... -print0 | xargs -0 to handle potential spaces/special chars in paths
        find . -name main.go -type f -printf '%h\0' | \
        while IFS= read -r -d $'\0' dir; do
          echo "--- Running swag init in $dir ---"
          # Use a subshell (parentheses) to avoid changing the main working directory
          (cd "$dir" && swag init)
          if [ $? -ne 0 ]; then
            echo "!!! swag init failed in $dir !!!"
            # Optionally exit if one fails: exit 1
          fi
          echo "--- Finished swag init in $dir ---"
        done

    # - name: Test
    #   run: go test -v ./...
